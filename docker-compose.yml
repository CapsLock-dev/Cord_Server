services:
  postgres:
    image: postgres:18-alpine
    container_name: cord_postgres
    shm_size: 128mb
    environment:
      PGTZ: UTC
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  
  migrate:
    image: ghcr.io/amacneil/dbmate
    container_name: cord_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@cord_postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./migrations:/db/migrations
    command: ["up"]

  adminer:
    container_name: cord_adminer
    image: adminer
    ports:
      - 8080:8080
    restart: unless-stopped

volumes:
  pgdata:
